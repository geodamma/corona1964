<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1964北北基桃｜美軍日冕計畫中，臺灣第一批高解析度衛星影像</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--fs:11px;
  --orange:#F37021; --orange-dark:#C85710; --orange-soft:#FFF1E6;
  --ink:#2b2118; --panel:rgba(255,255,255,.94);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-size:var(--fs);display:flex;flex-direction:column;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#222;overflow:hidden}

header{position:relative;background:var(--orange);color:#fff;padding:10px 16px 10px 14px}
#left{position:absolute;z-index:1000;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:calc(100% - 80px);pointer-events:none}
header .inner{position:relative;display:flex;align-items:center;gap:12px}
header .logo{flex:0 0 auto;width:44px;height:44px}
header h1{margin:0;font-size:calc(var(--fs)*1.3);letter-spacing:.06em;line-height:1.2;font-weight:900}
header p{margin:3px 0 0;font-size:var(--fs);opacity:.95}

#stage{position:relative;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;background:#d8d2c8}

/* Control panel */
#panel{pointer-events:auto;width:336px;background:var(--panel);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);overflow:hidden}
#panel .head{font-size:var(--fs);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-weight:700;color:var(--orange-dark);cursor:pointer;user-select:none}
#panel .body{padding:2px 14px 12px}
.row{display:flex;align-items:center;gap:8px;margin-top:2px}
.row label{flex:0 0 8em;font-size:var(--fs);font-weight:600;white-space:nowrap;margin:0}
.row .v{flex:0 0 2.8em;text-align:right;font-size:var(--fs);font-weight:600;color:var(--orange-dark);font-variant-numeric:tabular-nums}
.row small{display:block;color:#7a6a5c;font-size:11px;margin-top:-2px}
input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--orange);height:24px;margin:0}
#panel.collapsed .body{display:none}
#toggle{transition:transform .2s}
#panel.collapsed #toggle{transform:rotate(180deg)}

/* Zoom buttons */
#zoom{position:absolute;z-index:1000;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#zoom button{width:28px;height:28px;border:none;border-radius:6px;background:var(--orange);color:#fff;font-size:15px;font-weight:700;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
#zoom button:active{background:var(--orange-dark)}
#zoom button:disabled{opacity:.45}

footer{font-size:var(--fs);flex:0 0 auto;background:#fff;border-top:3px solid var(--orange);padding:6px 14px;padding-bottom:max(6px,env(safe-area-inset-bottom));line-height:1.5;color:#5b4d41;z-index:1000}
footer b{color:var(--orange-dark);font-weight:600}

#zoom button.txt{font-size:var(--fs);line-height:1.15}
#zoom button.on{background:#fff;color:var(--orange-dark);outline:2px solid var(--orange)}
.pt i{display:block;width:1.5px;height:1.5px;margin:2.25px;border-radius:50%;background:#C8500A;box-shadow:0 0 2.6px 1.3px #C8500A,0 0 6.5px 2.6px rgba(214,84,10,.55);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pt i{display:block;width:1.5px;height:1.5px;margin:2.25px;border-radius:50%;background:#C8500A;box-shadow:0 0 2.6px 1.3px #C8500A,0 0 6.5px 2.6px rgba(214,84,10,.55);animation:tw 3s ease-in-out infinite}}
footer a.ig{display:inline-flex;vertical-align:-3px;margin-left:4px;color:var(--orange-dark)}
footer a.ig img{width:16px;height:16px;display:block;border-radius:50%}
body{padding-top:env(safe-area-inset-top)}

/* Mobile: panel becomes bottom sheet */
@media (max-width:640px){
  #left{left:8px;right:44px;top:8px;max-width:none}
  #panel{width:100%}
  #zoom{right:8px;top:8px}
  :root{--fs:10.5px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="map"></div>

  <div id="left">
  <div id="panel">
<header>
  <div class="inner">
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="衛星看地球">
      <circle cx="30" cy="36" r="18" fill="#fff" fill-opacity=".18" stroke-width="2.2"/>
      <ellipse cx="30" cy="36" rx="8" ry="18" stroke-width="1.4"/>
      <path d="M12 36H48M15 26H45M15 46H45" stroke-width="1.4"/>
      <path d="M24 28c3-3 7-2 9 1s-1 5-4 5-3 4-6 4" stroke-width="0" fill="#fff" fill-opacity=".5"/>
      <!-- 軌道與繞行的衛星 -->
      <g transform="rotate(-28 30 36)">
        <ellipse cx="30" cy="36" rx="29" ry="9" stroke-width="1.4" stroke-dasharray="2 3"/>
        <g>
          <rect x="-3.5" y="-3" width="7" height="6" rx="1" fill="#fff" stroke-width="1"/>
          <rect x="-11" y="-2.2" width="6" height="4.4" fill="#fff" fill-opacity=".35" stroke-width="1"/>
          <rect x="5" y="-2.2" width="6" height="4.4" fill="#fff" fill-opacity=".35" stroke-width="1"/>
          <animateMotion dur="7s" repeatCount="indefinite" path="M1 36a29 9 0 1 1 58 0a29 9 0 1 1 -58 0"/>
        </g>
      </g>
    </svg>
    <div>
      <h1>1964北北基桃</h1>
      <p>美軍日冕計畫中，臺灣第一批高解析度衛星影像</p>
    </div>
  </div>
</header>
    <div class="head" id="phead"><span>圖層透明度</span><span id="toggle">▾</span></div>
    <div class="body">
      <div class="row">
        <label for="s64">1964年衛星影像</label>
        <input type="range" id="s64" min="0" max="100" value="100">
        <span class="v" id="v64"></span>
      </div>
      <div class="row">
        <label for="s04">1904年臺灣堡圖</label>
        <input type="range" id="s04" min="0" max="100" value="0">
        <span class="v" id="v04"></span>
      </div>
      <div class="row">
        <label for="sg">Google 衛星影像</label>
        <input type="range" id="sg" min="0" max="100" value="100">
        <span class="v" id="vg"></span>
      </div>
    </div>
  </div>
  </div>

  <div id="zoom">
    <button id="ovl" class="txt" aria-pressed="false" aria-label="套疊當今地標與路網" title="套疊當今地標與路網">地標<br>路網</button>
    <button id="mus" aria-pressed="false" aria-label="背景音樂" title="背景音樂">♫</button>
    <audio id="bgm" loop preload="none" src="https://commons.wikimedia.org/wiki/Special:FilePath/Erik_Satie_-_gymnopedies_-_la_1_ere._lent_et_douloureux.ogg"></audio>
  </div>

</div>
